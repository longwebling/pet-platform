services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pet-help-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pet_help}
      POSTGRES_USER: ${DB_USER:-pet_help}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pet_help} -d ${DB_NAME:-pet_help}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
